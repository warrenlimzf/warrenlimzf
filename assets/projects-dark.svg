<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Six projects Warren has built">
  <title>ls ~/projects</title>
  <defs>
    <clipPath id="wind"><rect width="1000" height="340" rx="12"/></clipPath>
    <linearGradient id="scand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39D353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39D353" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#wind)">
    <rect width="1000" height="340" fill="#010409"/>
    <rect width="1000" height="42" fill="#161B22"/>
    <line x1="0" x2="1000" y1="42" y2="42" stroke="#30363D"/>
    <circle cx="26" cy="21" r="6" fill="#FF5F57"/><circle cx="46" cy="21" r="6" fill="#FEBC2E"/><circle cx="66" cy="21" r="6" fill="#28C840"/>
