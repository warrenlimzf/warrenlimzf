    <set attributeName="opacity" to="1" begin="0.44s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.44s" dur="0.5s" fill="freeze"/>
    <rect x="674" y="112" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="696" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">03</text>
    <text x="696" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">Trading journal</text>
    <text x="696" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="696" dy="0">Every trade logged and reviewed,</tspan><tspan x="696" dy="20">embedded in my personal site</tspan></text>
    <line x1="696" x2="948" y1="240" y2="240" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="696" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">TYPESCRIPT · REVIEW</text>
  </g><g opacity="0">
    <set attributeName="opacity" to="1" begin="0.56s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.56s" dur="0.5s" fill="freeze"/>
    <rect x="42" y="300" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="64" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">04</text>
    <text x="64" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">VCP strategy desk</text>
    <text x="64" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="64" dy="0">Swing-trading rulebook tested on a</tspan><tspan x="64" dy="20">pre-registered out-of-sample run</tspan></text>
    <line x1="64" x2="316" y1="428" y2="428" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="64" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">PYTHON · BACKTESTING</text>
  </g><g opacity="0">
    <set attributeName="opacity" to="1" begin="0.68s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.68s" dur="0.5s" fill="freeze"/>
    <rect x="358" y="300" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="380" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">05</text>
    <text x="380" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">Bank NAV automation</text>
    <text x="380" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="380" dy="0">Reads LGT, BoS and UBS statements</tspan><tspan x="380" dy="20">into Excel, each figure screenshotted</tspan></text>
    <line x1="380" x2="632" y1="428" y2="428" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="380" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">PYTHON · OCR · OPEN SOURCE</text>
  </g><g opacity="0">
    <set attributeName="opacity" to="1" begin="0.80s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.80s" dur="0.5s" fill="freeze"/>
    <rect x="674" y="300" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="696" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">06</text>
    <text x="696" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">Web design skill</text>
    <text x="696" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="696" dy="0">A Claude Code skill that keeps my</tspan><tspan x="696" dy="20">sites from looking machine-made</tspan></text>
    <line x1="696" x2="948" y1="428" y2="428" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="696" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">CLAUDE CODE · DESIGN</text>
