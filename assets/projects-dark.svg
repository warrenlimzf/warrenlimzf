  <rect x="0.5" y="0.5" width="999" height="339" rx="12" fill="none" stroke="#30363D"/>
  <text x="28" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3FB950">warren@github</tspan><tspan fill="#7D8590">:</tspan><tspan fill="#79C0FF">~</tspan><tspan fill="#7D8590">$ </tspan><tspan fill="#E6EDF3">ls -la ~/projects  # most repos are private; the live work is on warrenlimzf.com</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><text x="28" y="104" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#79C0FF">Next.js    </tspan><tspan fill="#79C0FF" font-weight="700">  macro-research      </tspan><tspan fill="#E6EDF3">US macro indicators on live FRED charts, plus company research</tspan></text><text x="28" y="131" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#79C0FF">TypeScript </tspan><tspan fill="#79C0FF" font-weight="700">  market-dashboard    </tspan><tspan fill="#E6EDF3">a US market report every trading day: the tape and the movers</tspan></text><text x="28" y="158" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#79C0FF">TypeScript </tspan><tspan fill="#79C0FF" font-weight="700">  trading-journal     </tspan><tspan fill="#E6EDF3">every trade logged and reviewed, embedded in my site</tspan></text><text x="28" y="185" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#E3B341">Python     </tspan><tspan fill="#79C0FF" font-weight="700">  vcp-strategy-desk   </tspan><tspan fill="#E6EDF3">swing-trading rulebook on a pre-registered out-of-sample test</tspan></text><text x="28" y="212" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#E3B341">Python     </tspan><tspan fill="#79C0FF" font-weight="700">  bank-nav-automation </tspan><tspan fill="#E6EDF3">LGT, BoS and UBS statements into Excel, each figure screenshotted</tspan><tspan fill="#3FB950"> [public]</tspan></text><text x="28" y="239" font-size="13" xml:space="preserve"><tspan fill="#7D8590">drwxr-xr-x  </tspan><tspan fill="#FFA657">Claude Code</tspan><tspan fill="#79C0FF" font-weight="700">  web-design-skill    </tspan><tspan fill="#E6EDF3">a Claude Code skill that keeps my sites from looking machine-made</tspan></text></g>
  <text x="28" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#3FB950">warren@github</tspan><tspan fill="#7D8590">:</tspan><tspan fill="#79C0FF">~</tspan><tspan fill="#7D8590">$ </tspan><tspan fill="#E6EDF3"></tspan></text>
  <rect x="171.31" y="272" width="9" height="17" fill="#39D353"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
