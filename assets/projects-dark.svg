    <rect x="358" y="112" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="380" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">02</text>
    <text x="380" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">Market dashboard</text>
    <text x="380" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="380" dy="0">A US market report for each trading</tspan><tspan x="380" dy="20">day, with the tape and the movers</tspan></text>
    <line x1="380" x2="632" y1="240" y2="240" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="380" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">TYPESCRIPT · DATA</text>
