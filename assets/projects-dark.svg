<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" role="img" aria-label="Six projects Warren has built">
  <title>Things I have built</title>
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1222"/><stop offset="1" stop-color="#121D35"/>
    </linearGradient>
    <filter id="blurd" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="framed"><rect width="1000" height="508" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#framed)">
    <rect width="1000" height="508" fill="url(#bgd)"/>
    <g filter="url(#blurd)" opacity="0.9">
      <circle cx="780" cy="127" r="170" fill="#4A3B1F">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="432" r="190" fill="#1F3260">
        <animateTransform attributeName="transform" type="translate" values="0 0;70 -30;0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="507" rx="22" fill="none" stroke="#F3EDE0" stroke-opacity="0.12"/>
  <text x="44" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F3EDE0">Things I have built</text>
  <text x="44" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#9AA3B5">Most of these repos are private. The live work sits on warrenlimzf.com.</text>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0.20s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.20s" dur="0.5s" fill="freeze"/>
    <rect x="42" y="112" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="64" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D9BE84">01</text>
    <text x="64" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#F3EDE0">Macro research site</text>
    <text x="64" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#9AA3B5"><tspan x="64" dy="0">US macro indicators with live FRED</tspan><tspan x="64" dy="20">charts, plus company research</tspan></text>
    <line x1="64" x2="316" y1="240" y2="240" stroke="#F3EDE0" stroke-opacity="0.12"/>
    <text x="64" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#D9BE84">NEXT.JS · RESEARCH</text>
