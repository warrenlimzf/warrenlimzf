<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412" role="img" aria-label="About Warren in a terminal window">
  <title>whoami</title>
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1222"/><stop offset="1" stop-color="#121D35"/>
    </linearGradient>
    <filter id="blurd" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="framed"><rect width="1000" height="412" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#framed)">
    <rect width="1000" height="412" fill="url(#bgd)"/>
    <g filter="url(#blurd)" opacity="0.9">
      <circle cx="780" cy="103" r="170" fill="#4A3B1F">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="350" r="190" fill="#1F3260">
        <animateTransform attributeName="transform" type="translate" values="0 0;70 -30;0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="411" rx="22" fill="none" stroke="#F3EDE0" stroke-opacity="0.12"/>
  <defs><clipPath id="ccd0"><rect x="56" y="78" height="26" width="0"><animate attributeName="width" from="0" to="82" begin="0.40s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;10;20;31;41;51;61;71;82" keyTimes="0.000;0.111;0.222;0.333;0.444;0.556;0.667;0.778;0.889"/></rect></clipPath><clipPath id="ccd2"><rect x="56" y="132" height="26" width="0"><animate attributeName="width" from="0" to="142" begin="1.65s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;18;35;53;71;89;106;124;142" keyTimes="0.000;0.111;0.222;0.333;0.444;0.556;0.667;0.778;0.889"/></rect></clipPath><clipPath id="ccd4"><rect x="56" y="186" height="26" width="0"><animate attributeName="width" from="0" to="168" begin="2.90s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;21;42;63;84;105;126;147;168" keyTimes="0.000;0.111;0.222;0.333;0.444;0.556;0.667;0.778;0.889"/></rect></clipPath><clipPath id="ccd8"><rect x="56" y="294" height="26" width="0"><animate attributeName="width" from="0" to="150" begin="4.85s" dur="0.7s" fill="freeze" calcMode="discrete" values="0;19;38;56;75;94;113;132;150" keyTimes="0.000;0.111;0.222;0.333;0.444;0.556;0.667;0.778;0.889"/></rect></clipPath></defs>
  <rect x="24" y="24" width="952" height="364" rx="16" fill="#060B16" fill-opacity="0.55" stroke="#F3EDE0" stroke-opacity="0.12"/>
  <line x1="24" x2="976" y1="70" y2="70" stroke="#F3EDE0" stroke-opacity="0.12"/>
  <circle cx="52" cy="47" r="5.5" fill="#E5806B" fill-opacity="0.85"/><circle cx="70" cy="47" r="5.5" fill="#E6BE5A" fill-opacity="0.85"/><circle cx="88" cy="47" r="5.5" fill="#7DBE7A" fill-opacity="0.85"/>
  <text x="500" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9AA3B5">~/warren</text>
  <g clip-path="url(#ccd0)"><text x="56" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#D9BE84">$ <tspan fill="#F3EDE0">whoami</tspan></text></g><text x="78" y="123" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0">Warren Lim, Bachelor of Business (Banking &amp; Finance) at NTU, on exchange at SMU this fall<set attributeName="opacity" to="1" begin="1.30s" fill="freeze"/></text><g clip-path="url(#ccd2)"><text x="56" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#D9BE84">$ <tspan fill="#F3EDE0">cat focus.txt</tspan></text></g><text x="78" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0">Buy-side equity research. A good company is not always a good stock at today's price.<set attributeName="opacity" to="1" begin="2.55s" fill="freeze"/></text><g clip-path="url(#ccd4)"><text x="56" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#D9BE84">$ <tspan fill="#F3EDE0">ls track-record/</tspan></text></g><text x="78" y="231" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0">Eurasia AM Challenge <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">2026</tspan>: champion, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">97.1%</tspan> vs <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">90.5%</tspan> cumulative, Sharpe <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">0.94</tspan> vs <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">0.86</tspan><set attributeName="opacity" to="1" begin="3.80s" fill="freeze"/></text><text x="78" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0">Whitman Independent Advisors: factsheet processing cut from <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">3 min</tspan> to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">20 s</tspan><set attributeName="opacity" to="1" begin="4.15s" fill="freeze"/></text><text x="78" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0">Pinnacle Capital Asia: research on Salesforce, ServiceNow and Copart<set attributeName="opacity" to="1" begin="4.50s" fill="freeze"/></text><g clip-path="url(#ccd8)"><text x="56" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#D9BE84">$ <tspan fill="#F3EDE0">claude --build</tspan></text></g><text x="78" y="339" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#9AA3B5" opacity="0"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="0.92em" fill="#F3EDE0">30+</tspan> repos so far: research sites, trading tools, dashboards, automations<set attributeName="opacity" to="1" begin="5.75s" fill="freeze"/></text><text x="56" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#D9BE84" opacity="0">$ <tspan fill="#F3EDE0">▍</tspan><set attributeName="opacity" to="1" begin="6.10s" fill="freeze"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="6.20s" repeatCount="indefinite"/></text>
</svg>