    <text x="64" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">01</text>
    <text x="64" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">Macro research site</text>
    <text x="64" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="64" dy="0">US macro indicators with live FRED</tspan><tspan x="64" dy="20">charts, plus company research</tspan></text>
    <line x1="64" x2="316" y1="240" y2="240" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="64" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">NEXT.JS · RESEARCH</text>
