<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="508" viewBox="0 0 1000 508" role="img" aria-label="Six projects Warren has built">
  <title>Things I have built</title>
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#F0E8D8"/>
    </linearGradient>
    <filter id="blurl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="framel"><rect width="1000" height="508" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#framel)">
    <rect width="1000" height="508" fill="url(#bgl)"/>
    <g filter="url(#blurl)" opacity="0.9">
      <circle cx="780" cy="127" r="170" fill="#E8D3A6">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="432" r="190" fill="#C9D5EC">
        <animateTransform attributeName="transform" type="translate" values="0 0;70 -30;0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="507" rx="22" fill="none" stroke="#14213D" stroke-opacity="0.1"/>
  <text x="44" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#14213D">Things I have built</text>
  <text x="44" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#5B6478">Most of these repos are private. The live work sits on warrenlimzf.com.</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.20s" dur="0.5s" fill="freeze"/>
