    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.68s" dur="0.5s" fill="freeze"/>
    <rect x="358" y="300" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.58" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="380" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">05</text>
    <text x="380" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">Bank NAV automation</text>
    <text x="380" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="380" dy="0">Reads LGT, BoS and UBS statements</tspan><tspan x="380" dy="20">into Excel, each figure screenshotted</tspan></text>
    <line x1="380" x2="632" y1="428" y2="428" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="380" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">PYTHON · OCR · OPEN SOURCE</text>
  </g><g>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.80s" dur="0.5s" fill="freeze"/>
    <rect x="674" y="300" width="296" height="168" rx="14" fill="#FFFFFF" fill-opacity="0.58" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="696" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">06</text>
    <text x="696" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">Web design skill</text>
    <text x="696" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="696" dy="0">A Claude Code skill that keeps my</tspan><tspan x="696" dy="20">sites from looking machine-made</tspan></text>
    <line x1="696" x2="948" y1="428" y2="428" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="696" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">CLAUDE CODE · DESIGN</text>
