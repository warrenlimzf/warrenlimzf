    <text x="696" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">03</text>
    <text x="696" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">Trading journal</text>
    <text x="696" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="696" dy="0">Every trade logged and reviewed,</tspan><tspan x="696" dy="20">embedded in my personal site</tspan></text>
    <line x1="696" x2="948" y1="240" y2="240" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="696" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">TYPESCRIPT · REVIEW</text>
  </g><g>
    <animateTransform attributeName="transform" type="translate" values="0 10;0 0" begin="0.56s" dur="0.5s" fill="freeze"/>
