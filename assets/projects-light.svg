    <text x="64" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">04</text>
    <text x="64" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">VCP strategy desk</text>
    <text x="64" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="64" dy="0">Swing-trading rulebook tested on a</tspan><tspan x="64" dy="20">pre-registered out-of-sample run</tspan></text>
    <line x1="64" x2="316" y1="428" y2="428" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="64" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">PYTHON · BACKTESTING</text>
