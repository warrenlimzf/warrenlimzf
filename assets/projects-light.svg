    <text x="380" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#A8843F">02</text>
    <text x="380" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#14213D">Market dashboard</text>
    <text x="380" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5B6478"><tspan x="380" dy="0">A US market report for each trading</tspan><tspan x="380" dy="20">day, with the tape and the movers</tspan></text>
    <line x1="380" x2="632" y1="240" y2="240" stroke="#14213D" stroke-opacity="0.1"/>
    <text x="380" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.6" fill="#A8843F">TYPESCRIPT · DATA</text>
